services:
  - type: web
    name: asistencia-clases
    runtime: python
    plan: 0.5c-512mb
    buildCommand: python -m compileall -q server.py xlsx_export.py
    startCommand: python server.py
    healthCheckPath: /healthz
    maintenanceMode:
      enabled: true
    disk:
      name: asistencia-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ASISTENCIA_PUBLIC_MODE
        value: "1"
      - key: ASISTENCIA_DATA_DIR
        value: /var/data
