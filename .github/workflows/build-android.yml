name: Crear APK Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar componentes
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Incorporar configuración de Firebase
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          test -n "$FIREBASE_ANDROID_CONFIG_BASE64"
          printf '%s' "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > android/app/google-services.json

      - name: Sincronizar aplicación
        run: npx cap sync android

      - name: Generar iconos y pantalla inicial
        run: npm run android:assets

      - name: Incorporar personalización nativa
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp ../static/notification-badge.png android/app/src/main/res/drawable/notification_badge.png
          mkdir -p android/app/src/main/java/cl
          cp -R android-custom/java/cl/. android/app/src/main/java/cl/
          cp -R android-custom/res/. android/app/src/main/res/
          node scripts/prepare-android.mjs

      - name: Compilar APK de prueba
        run: ./android/gradlew -p android assembleDebug

      - name: Nombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Registro_de_Asistencia.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Registro_de_Asistencia
          path: mobile/Registro_de_Asistencia.apk
          if-no-files-found: error
